[project]
name = "labagent"
version = "0.1.0"
description = "Fluid laboratory agent platform skeleton"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "langgraph>=1,<2",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labagent"]

[project.scripts]
labagent-bridge = "labagent.bridge:main"
